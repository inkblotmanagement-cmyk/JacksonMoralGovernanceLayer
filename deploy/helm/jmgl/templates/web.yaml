{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jmgl.fullname" . }}-web
  labels: {{- include "jmgl.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicaCount }}
  {{- end }}
  selector:
    matchLabels: {{- include "jmgl.selector" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "jmgl.selector" (dict "root" . "component" "web") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "jmgl.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- include "jmgl.podSecurityContext" . | nindent 8 }}
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          env:
            - name: JMGL_API_UPSTREAM
              value: "http://{{ include "jmgl.fullname" . }}-api:8000"
            - name: JMGL_PUBLIC_API_BASE_URL
              value: {{ .Values.web.publicApiBaseUrl | quote }}
          livenessProbe:
            httpGet: { path: /nginx-health, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /nginx-health, port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext: {{- include "jmgl.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "jmgl.fullname" . }}-web
  labels: {{- include "jmgl.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector: {{- include "jmgl.selector" (dict "root" . "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
