{{- if .Values.networkPolicy.enabled }}
# API pods accept traffic on 8000 only; egress limited to DNS, PostgreSQL (5432) and Redis (6379).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "jmgl.fullname" . }}-api
  labels: {{- include "jmgl.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "jmgl.selector" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{ port: 8000, protocol: TCP }]
  egress:
    - ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - ports:
        - { port: 5432, protocol: TCP }
        - { port: 6379, protocol: TCP }
{{- end }}
