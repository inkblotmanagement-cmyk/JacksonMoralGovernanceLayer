# Main nginx config for the JMGL dashboard image. Works with a read-only root filesystem:
# only /tmp must be writable (pid, temp paths, and the rendered server config).
worker_processes  2;
error_log  /dev/stderr notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    log_format  json escape=json '{"ts":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
                                 '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
                                 '"duration":$request_time,"request_id":"$request_id"}';
    access_log  /dev/stdout json;

    sendfile        on;
    keepalive_timeout  65;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Rendered from /etc/nginx/templates/*.template by the image entrypoint (envsubst).
    include /tmp/conf.d/*.conf;
}
