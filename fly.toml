# Fly.io config for the JMGL API (dashboard: host web/dist on any static host/CDN, or run the
# web image as a second Fly app). Not deployed. To use:
#   fly launch --no-deploy --copy-config        # creates the app (pick a unique name)
#   fly secrets set JMGL_CLIENT_KEY_HASHES=... JMGL_ADMIN_KEY_HASHES=... \
#                   JMGL_AUDIT_DATABASE_URL=postgresql://... JMGL_AUDIT_HASH_SECRET=...
#   fly deploy
#   fly scale count 2 --region atl,ams          # multi-region (Atlanta + Amsterdam)
app = "jmgl-api-CHANGE-ME"
primary_region = "atl"

[build]
  dockerfile = "Dockerfile"

[env]
  JMGL_ENVIRONMENT = "production"
  JMGL_AUDIT_BACKEND = "sql"
  JMGL_AUDIT_RETENTION_DAYS = "90"
  JMGL_TRUST_PROXY_HEADERS = "true"
  FORWARDED_ALLOW_IPS = "*"
  JMGL_METRICS_PUBLIC = "false"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/readyz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

# Prometheus: /metrics needs the admin key when JMGL_METRICS_PUBLIC=false (recommended on Fly,
# where every path on the app is public). Scrape it from your own Prometheus with that key.
