name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Main red-team set + unit tests (must pass)
        run: python -m pytest -m "not heldout and not heldout2" -v
      - name: Held-out set (reported, not gating)
        run: python -m pytest -m heldout -v || true
      - name: Held-out set 2 (reported, not gating)
        run: python -m pytest -m heldout2 -v || true
